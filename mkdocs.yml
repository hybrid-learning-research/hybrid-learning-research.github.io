site_name: Έρευνα Υβριδικής Τάξης
site_url: https://hybrid-learning-research.github.io

theme:
  name: material
  language: el
  features:
    - navigation.tabs
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Σκούρο θέμα
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Φωτεινό θέμα

nav:
  - Αρχική: index.md
  - Πληροφορίες: participants.md
  - Συναίνεση: consent.md
  - Ραντεβού: booking.md

# Χωρίς αναζήτηση
plugins: []

markdown_extensions:
  - attr_list
